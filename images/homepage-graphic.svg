<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Fresh Press garment care graphic</title>
  <desc id="desc">A clean illustrated graphic featuring a freshly pressed shirt, hanger, bubbles, and sparkle accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f4f7"/>
      <stop offset="1" stop-color="#b9dce5"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <circle cx="155" cy="125" r="62" fill="#fff" opacity=".72"/>
  <circle cx="1040" cy="500" r="88" fill="#fff" opacity=".58"/>
  <circle cx="1010" cy="115" r="28" fill="#fff" opacity=".8"/>

  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9">
    <path d="M125 420c28-38 75-38 103 0"/>
    <circle cx="120" cy="355" r="18"/>
    <circle cx="230" cy="325" r="12"/>
    <circle cx="1060" cy="175" r="16"/>
    <circle cx="1100" cy="230" r="10"/>
  </g>

  <g transform="translate(390 85)">
    <path d="M210 45c0-30 25-55 55-55s55 25 55 55" fill="none" stroke="#315b68" stroke-width="16" stroke-linecap="round"/>
    <path d="M265 50 95 155 10 205l90 55 35 215h260l35-215 90-55-85-50z" fill="url(#shirt)" stroke="#315b68" stroke-width="10" stroke-linejoin="round"/>
    <path d="M185 100c24 35 48 52 80 52s56-17 80-52" fill="none" stroke="#8ab6c2" stroke-width="9"/>
    <path d="M265 154v276" stroke="#8ab6c2" stroke-width="7" opacity=".65"/>
    <path d="M80 300h370" stroke="#8ab6c2" stroke-width="6" opacity=".45"/>
  </g>

  <g fill="#fff" stroke="#315b68" stroke-width="7">
    <path d="M905 290l12 35 35 12-35 12-12 35-12-35-35-12 35-12z"/>
    <path d="M285 180l9 27 27 9-27 9-9 27-9-27-27-9 27-9z"/>
  </g>

  <text x="600" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#315b68" letter-spacing="2">FRESH PRESS</text>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4c737d">Professional garment care, made simple.</text>
</svg>
