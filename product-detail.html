<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | FreshPress Dry Cleaning</title>
  <meta name="description" content="View product details and add an item to your FreshPress cart." />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .product-detail { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .product-detail-card { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: #fff; border: 2px solid #ffb6c1; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(255,105,180,.15); }
    .detail-image { min-height: 500px; background: #fff5f8; }
    .detail-image img { width: 100%; height: 100%; min-height: 500px; object-fit: cover; display: block; }
    .detail-info { padding: 45px 35px; display: flex; flex-direction: column; justify-content: center; }
    .detail-category { color: #c71585; font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
    .detail-info h1 { color: #c71585; font-size: 34px; margin: 10px 0; }
    .detail-description { color: #666; line-height: 1.7; font-size: 16px; }
    .detail-price { color: #ff1493; font-size: 28px; font-weight: 700; margin: 20px 0; }
    .detail-add { padding: 14px 20px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#ff69b4,#ff1493); color: #fff; font-weight: 700; cursor: pointer; font-size: 16px; }
    .detail-add:hover { background: linear-gradient(135deg,#c71585,#8b0000); transform: translateY(-2px); }
    .back-products { display: inline-block; margin-bottom: 20px; color: #c71585; font-weight: 700; text-decoration: none; }
    .back-products:hover { text-decoration: underline; }
    @media (max-width: 700px) { .product-detail-card { grid-template-columns: 1fr; } .detail-image, .detail-image img { min-height: 350px; } .detail-info { padding: 30px 25px; } }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <div class="header-top">
        <div class="logo"><a href="index.html">Fresh Press</a></div>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
      <nav class="primary-nav" id="primary-nav" aria-label="Primary"></nav>
    </header>

    <main class="product-detail">
      <a class="back-products" href="products.html">← Back to Products</a>
      <div class="product-detail-card" id="product-detail-card"></div>
    </main>

    <footer class="footer"><div class="footer-content"><p>&copy; 2026 FreshPress Dry Cleaning. All rights reserved.</p></div></footer>
  </div>

  <script src="nav.js"></script>
  <script src="product-detail.js"></script>
</body>
</html>
